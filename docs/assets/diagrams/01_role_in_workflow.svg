  <text x="585" y="347" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#064E3B" opacity="0.85">models/, reports/</text>
  <rect x="710" y="304" width="210" height="64" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="815" y="331" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#064E3B">Forecast Chart &amp; CSV</text>
  <text x="815" y="347" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#064E3B" opacity="0.85">reports/</text>
  <rect x="940" y="304" width="210" height="64" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="1045" y="331" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#064E3B">AI Insights via Ollama</text>
  <text x="1045" y="347" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#064E3B" opacity="0.85">reports/ai_insights.txt</text>
  <rect x="1170" y="304" width="210" height="64" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="1275" y="331" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#064E3B">Full HTML/PDF Report</text>
  <text x="1275" y="347" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#064E3B" opacity="0.85">reports/full_report.*</text>
